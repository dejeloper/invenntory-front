<div
  class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-fade-in animate-duration-300"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="ariaLabel() || null"
  (click)="close.emit()">
  <div
    [class]="cardClass() + ' animate-fade-in-up animate-duration-500 animate-ease-out'"
    (click)="$event.stopPropagation()">
    <ng-content />
  </div>
</div>
