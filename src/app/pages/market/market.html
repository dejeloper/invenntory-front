<h2 class="text-xl font-semibold text-midnight-graphite mb-4">🛒 Mercado</h2>

<div class="bg-pure-white rounded-xl overflow-hidden border border-border-silver">
  @for (item of items; track item.name; let last = $last) {
  <div class="flex justify-between items-center px-4 py-3" [class]="!last ? 'border-b border-border-silver' : ''">
    <div>
      <p class="text-base">{{ item.name }}</p>
      <p class="text-xs text-medium-gray">{{ item.store }} - {{ item.price }}</p>
    </div>
    <span class="text-medium-gray">›</span>
  </div>
  }
</div>

<div class="mt-6 px-1">
  <p class="text-caption text-medium-gray mb-1">Total mercado</p>
  <p class="text-heading-lg font-semibold">{{ total }}</p>
</div>
