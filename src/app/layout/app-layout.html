<div class="h-screen flex flex-col bg-canvas-white text-midnight-graphite">
  <!-- NAVBAR -->
  <header class="h-12 flex items-center justify-between px-4 bg-pure-white/75 backdrop-blur-md border-b border-border-silver">
    <h1 class="text-lg font-semibold">{{ appName }}</h1>
    <button class="w-8 h-8 rounded-full bg-white flex items-center justify-center shadow-sm">
      <span class="text-sm">👤</span>
    </button>
  </header>

<!-- CONTENT -->
  <main class="flex-1 overflow-y-auto px-5 pt-6 pb-28 md:flex md:justify-center">
    <div class="w-full md:max-w-[480px] relative">
      <router-outlet />
    </div>
  </main>

  <!-- TAB BAR -->
  <footer
    class="fixed bottom-0 left-0 right-0 bg-pure-white/75 backdrop-blur-md border-t border-border-silver md:flex md:justify-center">
    <nav class="flex justify-around pt-2 pb-6 md:w-full md:max-w-120">
      <a routerLink="/market" routerLinkActive="text-interactive-blue bg-interactive-blue/10"
        class="flex flex-col items-center text-[10px] text-medium-gray rounded-xl px-3 py-1 transition-all duration-200">
        <span class="text-xl">🛒</span>
        Mercado
      </a>

      <a routerLink="/budget" routerLinkActive="text-interactive-blue bg-interactive-blue/10"
        class="flex flex-col items-center text-[10px] text-medium-gray rounded-xl px-3 py-1 transition-all duration-200">
        <span class="text-xl">💰</span>
        Presupuesto
      </a>

      <a routerLink="/settings" routerLinkActive="text-interactive-blue bg-interactive-blue/10"
        class="flex flex-col items-center text-[10px] text-medium-gray rounded-xl px-3 py-1 transition-all duration-200">
        <span class="text-xl">⚙️</span>
        Settings
      </a>
    </nav>
  </footer>
</div>
