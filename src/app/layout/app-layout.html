<div class="h-screen flex flex-col bg-canvas-white text-midnight-graphite">
  <!-- TOAST -->
  @if (toast.visible()) {
    <div class="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-midnight-graphite text-white px-4 py-2 rounded-xl shadow-xl">
      {{ toast.currentMessage() }}
    </div>
  }

  <!-- NAVBAR -->
  <header class="h-12 flex items-center justify-between px-4 bg-pure-white/75 backdrop-blur-md border-b border-border-silver">
    <h1 class="text-lg font-semibold">{{ appName }}</h1>
    <button class="w-8 h-8 rounded-full bg-white flex items-center justify-center shadow-sm">
      <span class="text-sm">👤</span>
    </button>
  </header>

  <!-- CONTENT -->
  <main class="flex-1 overflow-y-auto px-5 pt-6 pb-28 md:flex md:justify-center">
    <div class="w-full md:max-w-[480px] relative">
      <router-outlet />
    </div>
  </main>

  <!-- TAB BAR -->
  <footer class="fixed bottom-0 left-0 right-0 bg-pure-white/75 backdrop-blur-md border-t border-border-silver md:flex md:justify-center">
    <nav class="flex justify-around pt-2 pb-6 md:w-full md:max-w-[480px]">
      <a routerLink="/market" routerLinkActive="text-interactive-blue bg-interactive-blue/10"
        class="flex flex-col items-center text-[10px] text-medium-gray rounded-xl px-3 py-1 transition-all duration-200 relative">
        <span class="text-xl">🛒</span>
        Mercado
        @if (notifications.getMarketBadge() > 0) {
          <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-xs rounded-full flex items-center justify-center">
            {{ notifications.getMarketBadge() }}
          </span>
        }
      </a>

      <a routerLink="/budget" routerLinkActive="text-interactive-blue bg-interactive-blue/10"
        class="flex flex-col items-center text-[10px] text-medium-gray rounded-xl px-3 py-1 transition-all duration-200 relative">
        <span class="text-xl">💰</span>
        Presupuesto
      </a>

      <a routerLink="/settings" routerLinkActive="text-interactive-blue bg-interactive-blue/10"
        class="flex flex-col items-center text-[10px] text-medium-gray rounded-xl px-3 py-1 transition-all duration-200 relative">
        <span class="text-xl">⚙️</span>
        Settings
        @if (notifications.getSettingsBadge() > 0) {
          <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-xs rounded-full flex items-center justify-center">
            {{ notifications.getSettingsBadge() }}
          </span>
        }
      </a>
    </nav>
  </footer>
</div>
